name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Create Python environment and install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build frontend static assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Dot launcher binary
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller Dot.spec --noconfirm
          Copy-Item -Path "dist\Dot.exe" -Destination "Dot.exe" -Force

      - name: Assemble distribution package
        run: |
          python scripts/build_distribution.py --venv .venv

      - name: Compile Inno Setup installer
        run: |
          python scripts/compile_installer.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Dot-Setup-x64.exe
            dist/installer/Dot-Setup-x64.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
