name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Create Python environment and install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller

      - name: Build frontend static assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Bundle pinned MCP binaries (agent-browser 0.42.0 & github-mcp-server 1.5.0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "backend/dot/mcp/bin" | Out-Null
          npm install -g agent-browser@0.42.0
          $abRoot = (npm root -g).Trim()
          $abExe = Get-ChildItem -Path (Join-Path $abRoot "agent-browser") -Filter "agent-browser*.exe" -Recurse | Select-Object -First 1
          if (-not $abExe) { throw "agent-browser.exe not found after npm install -g agent-browser@0.42.0" }
          Copy-Item $abExe.FullName "backend/dot/mcp/bin/agent-browser.exe" -Force

          $ghZip = "$env:TEMP/github-mcp-server.zip"
          Invoke-WebRequest -Uri "https://github.com/github/github-mcp-server/releases/download/v1.5.0/github-mcp-server_Windows_x86_64.zip" -OutFile $ghZip
          Expand-Archive -Path $ghZip -DestinationPath "$env:TEMP/gh_mcp" -Force
          $ghExe = Get-ChildItem -Path "$env:TEMP/gh_mcp" -Filter "github-mcp-server.exe" -Recurse | Select-Object -First 1
          if (-not $ghExe) { throw "github-mcp-server.exe not found in release archive" }
          Copy-Item $ghExe.FullName "backend/dot/mcp/bin/github-mcp-server.exe" -Force

      - name: Assemble distribution package
        run: |
          python scripts/build_distribution.py --venv .venv --rebuild-exe

      - name: Compile Inno Setup installer
        run: |
          python scripts/compile_installer.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Dot-Setup-x64.exe
            dist/installer/Dot-Setup-x64.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
